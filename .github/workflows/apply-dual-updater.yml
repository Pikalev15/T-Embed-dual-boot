name: Apply staged updater implementation

on:
  pull_request:
    types: [edited]

permissions:
  contents: write
  pull-requests: read

jobs:
  apply:
    if: >-
      github.event.pull_request.number == 1 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'in-app-dual-updater'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Decode and apply implementation patch
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          body="$(curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" | jq -r .body)"
          printf '%s\n' "$body" |
            sed -n '/^<!-- DUAL_UPDATER_PATCH_GZ_B64$/,/^DUAL_UPDATER_PATCH_GZ_B64 -->$/p' |
            sed '1d;$d' | tr -d '\r\n' |
            base64 -d | gzip -d > /tmp/dual-updater.patch
          test -s /tmp/dual-updater.patch
          git apply --check /tmp/dual-updater.patch
          git apply /tmp/dual-updater.patch

      - name: Commit implementation and remove bootstrap workflow
        env:
          HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          rm -f .github/workflows/apply-dual-updater.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "feat: add staged in-app updater for both firmware slots"
          git push origin "HEAD:${HEAD_BRANCH}"
